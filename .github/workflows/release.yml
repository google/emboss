name: Release
on:
  push:
    branches:
      - 'master'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: Create and upload release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="v$(date -u +%Y.%m%d.%H%M%S)"
          zip -r emboss.zip . -x '*.git*'
          gh release create "${version}" emboss.zip \
            --target "${GITHUB_SHA}" \
            --title "${version}" \
            --generate-notes
